name: Ejercicio 6
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/data/data.json
jobs:
  validar-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar .github/workflows/data/data.json
        uses: GrantBirki/json-yaml-validate@v3
        with:
          files: .github/workflows/data/data.json
