name: Ejercicio 7
on:
  workflow_dispatch:
jobs:
  job-a:
    runs-on: ubuntu-latest
    outputs:
      numero: ${{ steps.generar.outputs.numero }}
    steps:
      - name: Generar número aleatorio
        id: generar
        run: echo "numero=$RANDOM" >> "$GITHUB_OUTPUT"
  job-b:
    runs-on: ubuntu-latest
    needs: job-a
    steps:
      - name: Mostrar número recibido
        run: echo "El Job A generó el número ${{ needs.job-a.outputs.numero }}"
