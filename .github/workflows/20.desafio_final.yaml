name: 20.desafio_final
on:
  workflow_dispatch:
    inputs:
      tests_seguridad:
        description: "¿Ejecutar los Tests de Seguridad?"
        type: choice
        options:
          - si
          - "no"
        default: "si"
jobs:
  ci-seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar que .github/workflows/data/ventas.json es JSON válido
        run: python3 -m json.tool .github/workflows/data/ventas.json > /dev/null && echo ".github/workflows/data/ventas.json es válido"
      - name: Escaneo de seguridad (claves API expuestas)
        if: ${{ inputs.tests_seguridad == 'si' }}
        run: python3 github-actions/escaneo_seguridad.py .github/workflows/data/ventas.json

  procesamiento:
    runs-on: ubuntu-latest
    needs: ci-seguridad
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - name: Generar reporte de ${{ matrix.entorno }}
        run: |
          {
            echo "Reporte de ventas - entorno: ${{ matrix.entorno }}"
            echo "Fecha: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Registros procesados: $(python3 -c "import json; print(len(json.load(open('.github/workflows/data/ventas.json'))['ventas']))")"
          } > reporte-${{ matrix.entorno }}.txt
          cat reporte-${{ matrix.entorno }}.txt
      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte-${{ matrix.entorno }}.txt

  notificacion:
    runs-on: ubuntu-latest
    needs: [ci-seguridad, procesamiento]
    if: ${{ success() }}
    steps:
      - name: Simular notificación a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: echo "Pipeline completado. Enviando notificación a $DISCORD_WEBHOOK"
