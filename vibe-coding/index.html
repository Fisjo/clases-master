<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de hipoteca</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1c2333; --muted: #5d6679;
    --accent: #2a5bd7; --border: #d5dbe7; --error: #c62828; --result: #eef3ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151d; --card: #1b2030; --text: #e8ecf5; --muted: #9aa4ba;
      --accent: #6b95ff; --border: #323a50; --error: #ff7b7b; --result: #222a42;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 14px;
    padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 1.4rem; margin: 0 0 20px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .9rem; }
  input {
    width: 100%; padding: 10px 12px; font-size: 1rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  input.invalid { border-color: var(--error); }
  .error { color: var(--error); font-size: .8rem; min-height: 1.1em; margin-top: 4px; }
  button {
    width: 100%; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  }
  button:hover { filter: brightness(1.1); }
  #results { margin-top: 24px; display: none; }
  .row { display: flex; justify-content: space-between; padding: 12px 14px;
    background: var(--result); border-radius: 8px; margin-bottom: 8px; }
  .row span { color: var(--muted); }
  .row strong { font-variant-numeric: tabular-nums; }
  .row.main strong { font-size: 1.25rem; color: var(--accent); }
  #schedule { margin-top: 24px; overflow-x: auto; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  tfoot td { font-weight: 700; border-bottom: 0; }
  #chart-wrap { margin-top: 24px; }
  #chart { width: 100%; height: auto; display: block; }
  #chart .axis { stroke: var(--border); stroke-width: 1; }
  #chart text { fill: var(--muted); font-size: 11px; }
  #chart .bar-capital { fill: var(--accent); }
  #chart .bar-interest { fill: #e8903a; }
  .legend { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
</style>
</head>
<body>
<main>
  <h1>Calculadora de hipoteca</h1>
  <form id="form" novalidate>
    <div class="field">
      <label for="amount">Importe del préstamo (€)</label>
      <input id="amount" type="number" min="0" step="any" inputmode="decimal" placeholder="Ej. 200000">
      <div class="error" id="err-amount"></div>
    </div>
    <div class="field">
      <label for="rate">Tipo de interés anual (%)</label>
      <input id="rate" type="number" min="0" step="any" inputmode="decimal" placeholder="Ej. 3.25">
      <div class="error" id="err-rate"></div>
    </div>
    <div class="field">
      <label for="years">Plazo (años)</label>
      <input id="years" type="number" min="0" step="any" inputmode="decimal" placeholder="Ej. 25">
      <div class="error" id="err-years"></div>
    </div>
    <button type="submit">Calcular</button>
  </form>

  <section id="results" aria-live="polite">
    <div class="row main"><span>Cuota mensual</span><strong id="monthly"></strong></div>
    <div class="row"><span>Total pagado</span><strong id="total"></strong></div>
    <div class="row"><span>Intereses totales</span><strong id="interest"></strong></div>
    <div id="schedule">
      <h2>Tabla de amortización</h2>
      <table>
        <thead><tr><th>Año</th><th>Intereses</th><th>Capital amortizado</th><th>Capital pendiente</th></tr></thead>
        <tbody id="schedule-body"></tbody>
        <tfoot><tr><td>Total</td><td id="sum-interest"></td><td id="sum-principal"></td><td></td></tr></tfoot>
      </table>
    </div>
    <div id="chart-wrap">
      <h2>Intereses y capital por año</h2>
      <svg id="chart" role="img" aria-label="Gráfico de barras apiladas de intereses y capital amortizado por año"></svg>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>Capital amortizado</span>
        <span><i style="background:#e8903a"></i>Intereses</span>
      </div>
    </div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const fmt = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });

  const rules = {
    amount: { label: "El importe", min: 0, allowZero: false },
    rate:   { label: "El tipo de interés", min: 0, allowZero: true },
    years:  { label: "El plazo", min: 0, allowZero: false },
  };

  // Devuelve el valor numérico o null si no es válido (y muestra el error).
  function validate(id) {
    const input = $(id), err = $("err-" + id), rule = rules[id];
    const raw = input.value.trim();
    let msg = "";
    const v = Number(raw);
    if (raw === "" || !Number.isFinite(v)) msg = "Introduce un número.";
    else if (v < 0) msg = rule.label + " no puede ser negativo.";
    else if (v === 0 && !rule.allowZero) msg = rule.label + " debe ser mayor que 0.";
    input.classList.toggle("invalid", !!msg);
    err.textContent = msg;
    return msg ? null : v;
  }

  // Sistema francés: cuota constante.
  function calculate(principal, annualRate, years) {
    const n = Math.round(years * 12);
    const r = annualRate / 100 / 12;
    const monthly = r === 0
      ? principal / n
      : principal * r / (1 - Math.pow(1 + r, -n));
    const total = monthly * n;
    return { monthly, total, interest: total - principal };
  }

  // Tabla anual: simula mes a mes con la misma cuota; el último mes
  // amortiza exactamente el saldo restante para cerrar en 0.
  function amortization(principal, annualRate, years, monthly) {
    const n = Math.round(years * 12);
    const r = annualRate / 100 / 12;
    const rows = [];
    let balance = principal;
    for (let m = 1; m <= n; m++) {
      const interest = balance * r;
      const capital = m === n ? balance : monthly - interest;
      balance = m === n ? 0 : balance - capital;
      const y = Math.ceil(m / 12);
      if (!rows[y - 1]) rows[y - 1] = { year: y, interest: 0, capital: 0, balance: 0 };
      const row = rows[y - 1];
      row.interest += interest; row.capital += capital; row.balance = balance;
    }
    return rows;
  }

  // Gráfico de barras apiladas (capital abajo, intereses arriba) en SVG.
  function drawChart(rows) {
    const W = 520, H = 240, L = 48, R = 8, T = 10, B = 28;
    const max = Math.max(...rows.map(x => x.interest + x.capital));
    const plotW = W - L - R, plotH = H - T - B;
    const slot = plotW / rows.length, bw = Math.max(2, slot * 0.7);
    const y = v => T + plotH - (v / max) * plotH;
    const compact = new Intl.NumberFormat("es-ES", { notation: "compact", maximumFractionDigits: 1 });
    const step = Math.ceil(rows.length / 10);
    let svg = "";
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4;
      svg += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>` +
             `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact.format(v)}</text>`;
    }
    rows.forEach((r, i) => {
      const x = L + i * slot + (slot - bw) / 2;
      const hc = (r.capital / max) * plotH, hi = (r.interest / max) * plotH;
      svg += `<rect class="bar-capital" x="${x}" y="${y(r.capital)}" width="${bw}" height="${hc}"><title>Año ${r.year}: capital ${fmt.format(r.capital)}</title></rect>` +
             `<rect class="bar-interest" x="${x}" y="${y(r.capital) - hi}" width="${bw}" height="${hi}"><title>Año ${r.year}: intereses ${fmt.format(r.interest)}</title></rect>`;
      if (i % step === 0) svg += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle">${r.year}</text>`;
    });
    const el = $("chart");
    el.setAttribute("viewBox", `0 0 ${W} ${H}`);
    el.innerHTML = svg;
  }

  const STORAGE_KEY = "hipoteca:ultimos-valores";
  function saveValues() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(
        { amount: $("amount").value, rate: $("rate").value, years: $("years").value }));
    } catch (_) { /* almacenamiento no disponible: se ignora */ }
  }
  function restoreValues() {
    try {
      const v = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!v) return false;
      for (const id of ["amount", "rate", "years"]) {
        if (typeof v[id] === "string") $(id).value = v[id];
      }
      return true;
    } catch (_) { return false; }
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const p = validate("amount"), r = validate("rate"), y = validate("years");
    if (p === null || r === null || y === null) { $("results").style.display = "none"; return; }
    if (Math.round(y * 12) < 1) {
      $("err-years").textContent = "El plazo debe ser de al menos 1 mes.";
      $("years").classList.add("invalid");
      $("results").style.display = "none";
      return;
    }
    const res = calculate(p, r, y);
    $("monthly").textContent = fmt.format(res.monthly);
    $("total").textContent = fmt.format(res.total);
    $("interest").textContent = fmt.format(res.interest);
    const rows = amortization(p, r, y, res.monthly);
    $("schedule-body").innerHTML = rows.map(x =>
      `<tr><td>${x.year}</td><td>${fmt.format(x.interest)}</td><td>${fmt.format(x.capital)}</td><td>${fmt.format(x.balance)}</td></tr>`
    ).join("");
    $("sum-interest").textContent = fmt.format(rows.reduce((a, x) => a + x.interest, 0));
    $("sum-principal").textContent = fmt.format(rows.reduce((a, x) => a + x.capital, 0));
    drawChart(rows);
    $("results").style.display = "block";
    saveValues();
  });

  // Al cargar: recupera los últimos valores y recalcula.
  if (restoreValues()) $("form").requestSubmit();

  // Validación en vivo al escribir.
  Object.keys(rules).forEach(id => $(id).addEventListener("input", () => validate(id)));
</script>
</body>
</html>
