<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de hipoteca</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1c2333; --muted: #5d6679;
    --accent: #2a5bd7; --border: #d5dbe7; --error: #c62828; --result: #eef3ff; --interest: #c9701a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151d; --card: #1b2030; --text: #e8ecf5; --muted: #9aa4ba;
      --accent: #6b95ff; --border: #323a50; --error: #ff7b7b; --result: #222a42; --interest: #f0a45d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 14px;
    padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 1.4rem; margin: 0 0 20px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .9rem; }
  input {
    width: 100%; padding: 10px 12px; font-size: 1rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  input.invalid { border-color: var(--error); }
  .error { color: var(--error); font-size: .8rem; min-height: 1.1em; margin-top: 4px; }
  button {
    width: 100%; padding: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  }
  button:hover { filter: brightness(1.1); }
  #results { margin-top: 24px; display: none; }
  .row { display: flex; justify-content: space-between; padding: 12px 14px;
    background: var(--result); border-radius: 8px; margin-bottom: 8px; }
  .row span { color: var(--muted); }
  .row strong { font-variant-numeric: tabular-nums; }
  .row.main strong { font-size: 1.25rem; color: var(--accent); }
  #schedule { margin-top: 24px; overflow-x: auto; }
  h2, caption { font-size: 1.1rem; font-weight: 700; margin: 0 0 10px; text-align: left; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  tfoot th { color: var(--text); font-weight: 700; border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; }
  tfoot td { font-weight: 700; border-bottom: 0; }
  #chart-wrap { margin-top: 24px; }
  #chart { width: 100%; height: auto; display: block; }
  #chart .axis { stroke: var(--border); stroke-width: 1; }
  #chart text { fill: var(--muted); font-size: 12px; }
  #chart g.bar { cursor: pointer; outline: none; }
  #chart g.bar:focus-visible rect, #chart g.bar.selected rect { stroke: var(--text); stroke-width: 1.5; }
  #chart-detail { margin: 8px 0 0; min-height: 1.3em; font-size: .9rem; }
  #chart .bar-capital { fill: var(--accent); }
  #chart .bar-interest { fill: var(--interest); }
  .legend { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
</style>
</head>
<body>
<main>
  <h1>Calculadora de hipoteca</h1>
  <form id="form" novalidate>
    <div class="field">
      <label for="amount">Importe del préstamo (€)</label>
      <input id="amount" type="number" min="0" max="1000000000" step="any" inputmode="decimal" placeholder="Ej. 200000">
      <div class="error" id="err-amount"></div>
    </div>
    <div class="field">
      <label for="rate">Tipo de interés anual (%)</label>
      <input id="rate" type="number" min="0" max="100" step="any" inputmode="decimal" placeholder="Ej. 3.25">
      <div class="error" id="err-rate"></div>
    </div>
    <div class="field">
      <label for="years">Plazo (años)</label>
      <input id="years" type="number" min="0" max="50" step="any" inputmode="decimal" placeholder="Ej. 25 (máx. 50)">
      <div class="error" id="err-years"></div>
    </div>
    <button type="submit">Calcular</button>
  </form>

  <section id="results">
    <div id="figures" aria-live="polite">
    <div class="row main"><span>Cuota mensual</span><strong id="monthly"></strong></div>
    <div class="row"><span>Total pagado</span><strong id="total"></strong></div>
    <div class="row"><span>Intereses totales</span><strong id="interest"></strong></div>
    </div>
    <div id="schedule">
      <table>
        <caption>Tabla de amortización</caption>
        <thead><tr><th scope="col">Año</th><th scope="col">Intereses</th><th scope="col">Capital amortizado</th><th scope="col">Capital pendiente</th></tr></thead>
        <tbody id="schedule-body"></tbody>
        <tfoot><tr><th scope="row">Total</th><td id="sum-interest"></td><td id="sum-principal"></td><td></td></tr></tfoot>
      </table>
    </div>
    <div id="chart-wrap">
      <h2>Intereses y capital por año</h2>
      <svg id="chart" role="img" aria-label="Gráfico de barras apiladas de intereses y capital amortizado por año"></svg>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>Capital amortizado</span>
        <span><i style="background:var(--interest)"></i>Intereses</span>
      </div>
      <p id="chart-detail" aria-live="polite">Toca o selecciona una barra para ver su detalle.</p>
    </div>
  </section>
</main>

<script src="calc.js"></script>
<script>
  const { RULES, parseField, summary } = Hipoteca;
  const $ = id => document.getElementById(id);
  const IDS = Object.keys(RULES);
  const fmt = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });

  // Valida un campo y muestra u oculta su error. Devuelve el valor o null.
  function validate(id) {
    const { value, error } = parseField(id, $(id).value);
    $(id).classList.toggle("invalid", !!error);
    $("err-" + id).textContent = error;
    return value;
  }

  // Gráfico de barras apiladas (capital abajo, intereses arriba) en SVG.
  function drawChart(rows) {
    const W = 360, H = 230, L = 44, R = 6, T = 10, B = 28;
    const max = rows.reduce((m, x) => Math.max(m, x.interest + x.capital), 0);
    const plotW = W - L - R, plotH = H - T - B;
    const slot = plotW / rows.length, bw = Math.max(2, slot * 0.7);
    const y = v => T + plotH - (v / max) * plotH;
    const compact = new Intl.NumberFormat("es-ES", { notation: "compact", maximumFractionDigits: 1 });
    const step = Math.ceil(rows.length / 8);
    let svg = "";
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4;
      svg += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>` +
             `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact.format(v)}</text>`;
    }
    rows.forEach((r, i) => {
      const x = L + i * slot + (slot - bw) / 2;
      const hc = (r.capital / max) * plotH, hi = (r.interest / max) * plotH;
      const label = `Año ${r.year}: capital ${fmt.format(r.capital)}, intereses ${fmt.format(r.interest)}`;
      svg += `<g class="bar" tabindex="0" role="img" aria-label="${label}" data-label="${label}">` +
             `<title>${label}</title>` +
             `<rect x="${x - 1}" y="${T}" width="${bw + 2}" height="${plotH}" fill="transparent"/>` +
             `<rect class="bar-capital" x="${x}" y="${y(r.capital)}" width="${bw}" height="${hc}"/>` +
             `<rect class="bar-interest" x="${x}" y="${y(r.capital) - hi}" width="${bw}" height="${hi}"/></g>`;
      if (i % step === 0) svg += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle">${r.year}</text>`;
    });
    const el = $("chart");
    el.setAttribute("viewBox", `0 0 ${W} ${H}`);
    el.innerHTML = svg;
    $("chart-detail").textContent = "Toca o selecciona una barra para ver su detalle.";
  }

  // Detalle de la barra al tocarla o enfocarla con el teclado.
  function selectBar(g) {
    if (!g) return;
    document.querySelectorAll("#chart g.bar.selected").forEach(n => n.classList.remove("selected"));
    g.classList.add("selected");
    $("chart-detail").textContent = g.dataset.label;
  }
  $("chart").addEventListener("click", e => selectBar(e.target.closest("g.bar")));
  $("chart").addEventListener("focusin", e => selectBar(e.target.closest("g.bar")));

  // Últimos valores usados.
  const STORAGE_KEY = "hipoteca:ultimos-valores";
  function saveValues() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(
        Object.fromEntries(IDS.map(id => [id, $(id).value]))));
    } catch (_) { /* almacenamiento no disponible: se ignora */ }
  }
  // Rellena los campos solo si los tres valores guardados siguen siendo válidos.
  function restoreValues() {
    try {
      const v = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (!v || !IDS.every(id => typeof v[id] === "string" && parseField(id, v[id]).value !== null)) return false;
      IDS.forEach(id => { $(id).value = v[id]; });
      return true;
    } catch (_) { return false; }
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const [p, r, y] = IDS.map(validate);
    if (p === null || r === null || y === null) { $("results").style.display = "none"; return; }
    const res = summary(p, r, y);
    $("monthly").textContent = fmt.format(res.monthly);
    $("total").textContent = fmt.format(res.total);
    $("interest").textContent = fmt.format(res.interest);
    $("schedule-body").innerHTML = res.rows.map(x =>
      `<tr><td>${x.year}</td><td>${fmt.format(x.interest)}</td><td>${fmt.format(x.capital)}</td><td>${fmt.format(x.balance)}</td></tr>`
    ).join("");
    $("sum-interest").textContent = fmt.format(res.interest);
    $("sum-principal").textContent = fmt.format(res.capital);
    drawChart(res.rows);
    $("results").style.display = "block";
    saveValues();
  });

  // Al cargar: recupera los últimos valores válidos y recalcula.
  if (restoreValues()) $("form").requestSubmit();

  // Validación en vivo al escribir.
  IDS.forEach(id => $(id).addEventListener("input", () => validate(id)));
</script>
</body>
</html>
